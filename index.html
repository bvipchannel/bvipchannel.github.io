<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Трансляция</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070707;
            --card-bg: rgba(20, 20, 20, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --gold: #d4af37;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 950px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px var(--border-color);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 7, 7, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            cursor: pointer;
        }

        .play-btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }

        .chat-section {
            margin-top: 24px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            box-sizing: border-box;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .chat-section h3 {
            margin-top: 0;
            font-size: 14px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .chat-box {
            height: 150px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            font-size: 13px;
            color: #d1d1d6;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .chat-message {
            margin-bottom: 8px;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-row {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        .chat-input:focus {
            border-color: var(--gold);
        }

        .chat-send {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
        }

        .error-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: #ff453a;
        }
    </style>
</head>
<body>

    <div id="content" class="container" style="display: none;">
        <h1>💎 VIP GRAFBALAS STREAM</h1>
        <p>Эксклюзивный доступ авторизован</p>
        
        <div class="video-container" id="videoBox">
            <!-- Прямое официальное встраивание YouTube с принудительным включением -->
            <iframe id="videoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            
            <div class="play-overlay" id="playOverlay" onclick="startStream()">
                <button class="play-btn">СМОТРЕТЬ ТРАНСЛЯЦИЮ</button>
                <p style="margin-top: 14px; color: var(--text-muted); font-size: 12px;">Нажмите для активации видео и звука</p>
            </div>
        </div>

        <div class="chat-section">
            <h3>💬 Закрытый чат</h3>
            <div class="chat-box" id="chatMessages">
                <div class="chat-message"><span style="color: var(--gold);">[Система]:</span> Добро пожаловать на просмотр!</div>
            </div>
            <div class="chat-form">
                <div class="chat-row">
                    <input type="text" id="usernameInput" class="chat-input" placeholder="Ваше имя" style="width: 35%;" />
                    <input type="text" id="messageInput" class="chat-input" placeholder="Ваше сообщение..." style="width: 65%;" onkeydown="checkEnter(event)" />
                </div>
                <button class="chat-send" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <div id="error" class="error-screen" style="display: none;">
        <h2>⛔ Доступ ограничен</h2>
        <p>У вас нет персонального ключа.<br>Получите ссылку через Telegram-бот VIP GRAFBALAS.</p>
    </div>

    <script>
        const videoId = "6gr8zhzHhOE";

        window.onload = function() {
            const savedName = localStorage.getItem('chat_username');
            if (savedName) {
                document.getElementById('usernameInput').value = savedName;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');

            if (userId && userId.trim() !== "") {
                document.getElementById('content').style.display = 'block';
                // Обычный iframe ютуба, но с автоплей выключенным до нажатия кнопки
                document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=0`;
                
                setInterval(fetchMessages, 3000);
            } else {
                document.getElementById('error').style.display = 'flex';
            }
        };

        function startStream() {
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1`;
            document.getElementById('playOverlay').style.display = 'none';
        }

        async function sendMessage() {
            const usernameInput = document.getElementById('usernameInput');
            const messageInput = document.getElementById('messageInput');

            let name = usernameInput.value.trim() || "Резидент";
            let text = messageInput.value.trim();

            if (!text) return;

            localStorage.setItem('chat_username', name);

            try {
                await fetch('https://stream-sxnh.onrender.com/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, text: text })
                });
                messageInput.value = '';
                fetchMessages();
            } catch (error) {
                console.error("Ошибка отправки:", error);
            }
        }

        async function fetchMessages() {
            try {
                let response = await fetch('https://stream-sxnh.onrender.com/api/messages');
                let data = await response.json();
                const chatMessages = document.getElementById('chatMessages');
                
                let htmlContent = '';
                data.messages.forEach(msg => {
                    htmlContent += `<div class="chat-message"><span style="color: var(--gold);">${escapeHtml(msg.name)}:</span> ${escapeHtml(msg.text)}</div>`;
                });
                
                if (chatMessages.innerHTML !== htmlContent) {
                    let isScrolledToBottom = chatMessages.scrollHeight - chatMessages.clientHeight <= chatMessages.scrollTop + 20;
                    chatMessages.innerHTML = htmlContent;
                    if (isScrolledToBottom) {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                }
            } catch (e) {
                console.error("Ошибка чата", e);
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
